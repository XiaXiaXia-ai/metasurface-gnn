# M1 -- control: a CNN/U-Net regresses the fixed 46x180 pattern directly.
# No graph, no unit-cell library, no radiation operator.
data:
  root: D:/dataset
  split_seed: 20261022
  val_frac: 0.15
  test_frac: 0.15
seed: 0
out_dir: runs
physics:
  freq_ghz: 10.0
  projection: vector
model:
  name: m1
  base_width: 16
  out_rank: 4
  dropout: 0.0
loss:
  mode: power
  compression: asinh
  compression_db: 3.0
  angle_weight: solid_angle
  weight_floor: 0.2
  mainlobe_deg: 6.0
  mainlobe_boost: 3.0
optim:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 8
  epochs: 80
  patience: 20
  grad_clip: 1.0
  scheduler: cosine
  min_lr: 1.0e-5
runtime:
  threads: 4
  dtype: float32
