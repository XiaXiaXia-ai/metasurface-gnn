# M2 -- ablation: the GNN predicts q directly (no baseline skip connection).
# Everything else is identical to train_m3.yaml, so M2 vs M3 isolates 'q0 + residual'.
data:
  root: D:/dataset
  split_seed: 20261022
  val_frac: 0.15
  test_frac: 0.15
seed: 0
out_dir: runs
graph:
  radius: 1
physics:
  freq_ghz: 10.0
  projection: vector
  gamma_source: floquet
model:
  name: m2
  hidden: 64
  n_layers: 3
  global_branch: false
  dropout: 0.0
  layer_norm: true
loss:
  mode: power
  compression: asinh
  compression_db: 3.0
  angle_weight: solid_angle
  weight_floor: 0.2
  mainlobe_deg: 6.0
  mainlobe_boost: 3.0
optim:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 8
  epochs: 60
  patience: 15
  grad_clip: 1.0
  scheduler: cosine
  min_lr: 1.0e-5
runtime:
  threads: 4
  dtype: float32
